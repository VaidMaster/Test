<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מורה שוק ההון</title>
<meta name="description" content="קורס שוק ההון ב-35 שיעורים: אפליקציה לימודית עם מעבדות על נתונים אמיתיים וסימולטור מסחר.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centered reading column (720px) with a fixed bottom tab bar; the simulator widens to a two-pane trading desk. */
:root {
  --bg: #eef2ef; --surface: #ffffff; --raise: #f6f8f6; --ink: #13201c; --muted: #5a6b64; --line: #d6dfd9;
  --accent: #a8650f; --accent-ink: #ffffff; --accent-soft: #f6ead8;
  --up: #11805a; --down: #c03a26; --warn: #a86a00; --up-soft: #e2f3ea; --down-soft: #fbe7e2; --warn-soft: #fbf0d9;
  --s1: #1f5f8b; --s2: #6a7f78; --s3: #a8650f;
  --f-display: "Secular One", "IBM Plex Sans Hebrew", "Arial Hebrew", sans-serif;
  --f-body: "IBM Plex Sans Hebrew", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 14px; --r-sm: 9px; --shadow: 0 1px 2px rgba(19, 32, 28, .06), 0 8px 24px rgba(19, 32, 28, .06);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --tabs-h: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1311; --surface: #131e1b; --raise: #182622; --ink: #e4ede9; --muted: #8ea29a; --line: #24342f;
  --accent: #e3a548; --accent-ink: #1a1206; --accent-soft: #2e2414;
  --up: #3cc488; --down: #f0715c; --warn: #e6b04a; --up-soft: #12291f; --down-soft: #2f1712; --warn-soft: #2b2312;
  --s1: #6fb1df; --s2: #8ea29a; --s3: #e3a548; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1311; --surface: #131e1b; --raise: #182622; --ink: #e4ede9; --muted: #8ea29a; --line: #24342f;
  --accent: #e3a548; --accent-ink: #1a1206; --accent-soft: #2e2414;
  --up: #3cc488; --down: #f0715c; --warn: #e6b04a; --up-soft: #12291f; --down-soft: #2f1712; --warn-soft: #2b2312;
  --s1: #6fb1df; --s2: #8ea29a; --s3: #e3a548; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--f-body); padding: 0 16px calc(var(--tabs-h) + 24px + env(safe-area-inset-bottom, 0px)); min-height: 100vh; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 400; line-height: 1.25; margin: 0; text-wrap: balance; letter-spacing: 0; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
code { font-family: var(--f-mono); font-size: .88em; background: var(--raise); border: 1px solid var(--line); border-radius: 5px; padding: 0 .3em; direction: ltr; unicode-bidi: isolate; }
.muted { color: var(--muted); }
.tiny { font-size: 12px; }
.up { color: var(--up); } .down { color: var(--down); }
.eyebrow { font-size: 12px; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-bottom: 6px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 10px; max-width: 1240px; margin: 0 auto; padding-block: 10px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 19px; background: none; border: 0; padding: 0; }
.brand svg { width: 26px; height: 26px; }
.top .grow { flex: 1; }
#top-stats { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.pill { font-size: 13px; padding: 3px 10px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; font-size: 18px; }
.icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }

/* main + transitions */
#main { max-width: 720px; margin: 0 auto; padding-block: 8px 24px; display: flex; flex-direction: column; gap: 16px; }
body[data-view="sim"] #main { max-width: 1240px; }
.enter-fwd { animation: enterF .38s var(--ease); } .enter-back { animation: enterB .38s var(--ease); }
@keyframes enterF { from { opacity: 0; transform: translateX(-18px); } }
@keyframes enterB { from { opacity: 0; transform: translateX(18px); } }

/* tabs */
#tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: flex; justify-content: center; gap: 4px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
#tabs button { flex: 0 1 120px; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; padding: 6px 4px; border-radius: 12px; color: var(--muted); font-size: 12px; transition: color .2s, background .2s; }
#tabs svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; transition: transform .25s var(--ease); }
#tabs button.on { color: var(--accent); background: var(--accent-soft); }
#tabs button.on svg { transform: translateY(-1px) scale(1.08); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 11px; font-weight: 600; transition: transform .12s var(--ease), background .2s, opacity .2s; min-height: 44px; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.big { width: 100%; padding: 14px; font-size: 17px; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.sm { min-height: 34px; padding: 5px 12px; font-size: 14px; }
.btn.buy { background: var(--up); color: #fff; } .btn.sell { background: var(--down); color: #fff; }
.btn.danger { color: var(--down); border-color: var(--down); }
.btn.danger:not(.ghost) { background: var(--down); color: #fff; }
.link { background: none; border: 0; color: var(--accent); padding: 0; font-weight: 600; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; opacity: .7; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.card h3 { font-size: 20px; }
.card.soft { background: var(--raise); }
.page-h { font-size: 30px; margin-top: 8px; }
.page-sub { margin-top: -8px; }

/* home */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; padding-block: 10px 4px; }
.hero h1 { font-size: clamp(30px, 6.4vw, 44px); }
.lede { color: var(--muted); margin-top: 10px; max-width: 46ch; }
.ring { position: relative; width: 112px; height: 112px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 9; }
.ring-bg { stroke: var(--line); } .ring-fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1.2s var(--ease); animation: ringIn 1.2s var(--ease); }
@keyframes ringIn { from { stroke-dashoffset: 290; } }
.ring div { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.1; }
.ring b { font-family: var(--f-display); font-size: 30px; font-weight: 400; } .ring span { font-size: 12px; color: var(--muted); }
.next { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); box-shadow: var(--shadow); }
.next h2 { font-size: 24px; }
.steps-mini { display: flex; gap: 4px; } .steps-mini i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); transition: background .3s; } .steps-mini i.on { background: var(--accent); }
.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.qa { text-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 2px; transition: transform .15s var(--ease), border-color .2s; min-width: 0; }
.qa:hover { border-color: var(--accent); transform: translateY(-2px); }
.qa b { font-family: var(--f-display); font-weight: 400; font-size: 17px; } .qa span { font-size: 13px; color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.facts div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.facts b { font-family: var(--f-display); font-weight: 400; font-size: 30px; color: var(--accent); font-variant-numeric: tabular-nums; direction: ltr; text-align: right; }
.facts span { font-size: 14px; color: var(--muted); }
.days { display: flex; gap: 6px; flex-wrap: wrap; }
.days button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--raise); font-weight: 600; transition: all .2s var(--ease); }
.days button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); transform: scale(1.05); }
.plan-next { font-size: 14px; }
.phases { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.phases li { display: flex; gap: 12px; align-items: flex-start; }
.phases li > b { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--raise); border: 1px solid var(--line); font-family: var(--f-display); font-weight: 400; flex: none; }
.phases li.cur > b { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.phases li.done > b { background: var(--up); color: #fff; border-color: var(--up); }
.phases li div { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.phases em { font-style: normal; font-size: 13px; color: var(--muted); }
.phases i { display: block; height: 4px; background: var(--line); border-radius: 2px; margin-top: 6px; position: relative; overflow: hidden; }
.phases i::after { content: ""; position: absolute; inset: 0 auto 0 0; right: 0; width: var(--w); background: var(--up); border-radius: 2px; margin-inline-start: auto; }

/* course map */
.phase-sec { display: flex; flex-direction: column; gap: 8px; }
.phase-sec header { display: flex; flex-direction: column; padding-top: 10px; }
.phase-sec header b { font-size: 12px; color: var(--accent); letter-spacing: .06em; }
.phase-sec header h2 { font-size: 22px; } .phase-sec header span { font-size: 13px; color: var(--muted); }
.lessons { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.lessons button { width: 100%; text-align: start; display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; transition: transform .15s var(--ease), border-color .2s; }
.lessons button:hover:not(.locked) { transform: translateX(-3px); border-color: var(--accent); }
.lessons button.locked { opacity: .55; }
.lessons .st { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--raise); font-style: normal; font-weight: 700; flex: none; font-variant-numeric: tabular-nums; }
.lessons .done .st { background: var(--up-soft); color: var(--up); }
.lessons .open .st { background: var(--accent-soft); color: var(--accent); }
.lessons span { display: flex; flex-direction: column; min-width: 0; } .lessons em { font-style: normal; font-size: 13px; color: var(--muted); }

/* lesson */
.lesson { display: flex; flex-direction: column; gap: 14px; }
.l-head { display: flex; gap: 12px; align-items: flex-start; }
.l-head h1 { font-size: clamp(22px, 4.6vw, 30px); }
.stepper { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); z-index: 10; background: var(--bg); padding-block: 6px; }
.stepper::-webkit-scrollbar { display: none; }
.stepper button { flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 2px 4px; font-size: 12px; color: var(--muted); min-width: 56px; }
.stepper i { display: block; width: 100%; height: 5px; border-radius: 3px; background: var(--line); transition: background .3s var(--ease), transform .3s var(--ease); }
.stepper .done i { background: color-mix(in srgb, var(--up) 70%, var(--line)); }
.stepper .on i { background: var(--accent); transform: scaleY(1.5); }
.stepper .on { color: var(--ink); font-weight: 600; }
.stepper .locked { opacity: .5; }
.l-body { display: flex; flex-direction: column; gap: 14px; min-height: 40vh; }
.slide-fwd { animation: slideF .34s var(--ease); } .slide-back { animation: slideB .34s var(--ease); }
@keyframes slideF { from { opacity: 0; transform: translateX(-28px); } }
@keyframes slideB { from { opacity: 0; transform: translateX(28px); } }
.l-foot { position: sticky; bottom: calc(var(--tabs-h) + 8px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; justify-content: space-between; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(8px); padding-block: 8px; z-index: 5; }
.l-foot .btn:last-child { flex: 1; max-width: 320px; background: var(--accent); color: var(--accent-ink); }
.st-h { font-size: 22px; }
.prose { display: block; }
.prose > * + * { margin-top: 8px; }
.prose ul, .prose ol, .howto { margin: 0; padding-inline-start: 22px; display: flex; flex-direction: column; gap: 4px; }
.chunk h3 { font-size: 22px; }
.chunk-prog { display: flex; gap: 4px; align-items: center; } .chunk-prog i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); transition: background .3s; } .chunk-prog i.on { background: var(--accent); } .chunk-prog span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-inline-start: 6px; }
.why { background: var(--accent-soft); border-color: transparent; }
.goals { background: var(--raise); }
button.term { background: none; border: 0; padding: 0; color: inherit; font: inherit; text-decoration: underline dotted var(--accent); text-underline-offset: 4px; text-decoration-thickness: 2px; cursor: help; }
.pop { position: absolute; z-index: 60; max-width: 300px; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); animation: pop .2s var(--ease); display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.pop .link { color: var(--accent); align-self: flex-start; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
.fab { position: fixed; bottom: calc(var(--tabs-h) + 72px + env(safe-area-inset-bottom, 0px)); left: 16px; z-index: 25; display: flex; align-items: center; gap: 6px; border: 0; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 99px; box-shadow: var(--shadow); font-weight: 600; font-size: 14px; animation: fabIn .5s .3s var(--ease) both; }
.fab svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
@keyframes fabIn { from { opacity: 0; transform: translateY(12px); } }

/* MCQ + feedback */
.mcq { display: flex; flex-direction: column; gap: 10px; }
.q { font-weight: 600; font-size: 17px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: start; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; transition: border-color .2s, background .2s, transform .12s var(--ease); min-height: 48px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:active:not(:disabled) { transform: scale(.985); }
.opt.right { border-color: var(--up); background: var(--up-soft); }
.opt.wrong { border-color: var(--down); background: var(--down-soft); }
.opt:disabled { cursor: default; }
.fb-in { border-radius: 12px; padding: 12px 14px; animation: pop .25s var(--ease); }
.fb-in.ok { background: var(--up-soft); } .fb-in.no { background: var(--down-soft); } .fb-in.soft { background: var(--warn-soft); }
.fb-in b { margin-inline-end: 4px; }
.pulse-good { animation: pulseG .5s var(--ease); }
@keyframes pulseG { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--up) 50%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.xp-float { position: fixed; z-index: 90; pointer-events: none; font-weight: 700; color: var(--accent); font-family: var(--f-display); transform: translateX(-50%); animation: xp 1.1s var(--ease) forwards; }
@keyframes xp { to { transform: translate(-50%, -48px); opacity: 0; } }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 95; }
.quiz-prog { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; } .quiz-prog i { display: block; height: 100%; background: var(--accent); transition: width .4s var(--ease); }
.result { text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; padding: 26px 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); animation: pop .35s var(--ease); }
.result.pass { background: var(--up-soft); border-color: transparent; } .result.fail { background: var(--down-soft); border-color: transparent; }
.big-num { font-family: var(--f-display); font-size: 54px; line-height: 1; font-variant-numeric: tabular-nums; } .big-num b { font-weight: 400; }
.practice .ans { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.practice input { flex: 1; min-width: 140px; font-size: 20px; font-family: var(--f-mono); padding: 10px 12px; border-radius: 11px; border: 1.5px solid var(--line); background: var(--raise); direction: ltr; text-align: right; }
.practice em { font-style: normal; color: var(--muted); }
.hint { display: none; background: var(--warn-soft); border-radius: 10px; padding: 10px 12px; } .hint.show { display: block; animation: pop .25s var(--ease); }
.hints { display: flex; flex-direction: column; gap: 6px; }
.sol { display: none; background: var(--raise); border-radius: 10px; padding: 10px 12px; border: 1px dashed var(--line); } .sol.show { display: block; animation: pop .25s var(--ease); }
textarea, input[type="text"], input[type="search"], input[type="number"], input[type="date"], input[type="time"], select { width: 100%; border: 1.5px solid var(--line); background: var(--raise); border-radius: 10px; padding: 9px 11px; }
textarea { resize: vertical; line-height: 1.6; }
blockquote { margin: 0; border-inline-start: 3px solid var(--accent); padding: 4px 12px; color: var(--ink); background: var(--raise); border-radius: 0 8px 8px 0; white-space: pre-wrap; }

/* checklists & misc */
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.checklist li { padding-inline-start: 26px; position: relative; }
.checklist li.ok::before, .checklist li.no::before { position: absolute; inset-inline-start: 0; top: 0; width: 20px; text-align: center; font-weight: 700; }
.checklist li.ok::before { content: "✓"; color: var(--up); } .checklist li.no::before { content: "✗"; color: var(--down); }
.checklist.interactive li { padding: 0; }
.chk { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 6px 0; }
.chk input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; margin-top: 3px; }
.code-wrap { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--raise); }
.code-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
pre.code { margin: 0; padding: 12px 14px; overflow-x: auto; font: 13px/1.6 var(--f-mono); direction: ltr; text-align: left; white-space: pre; }
pre.code.md { white-space: pre-wrap; direction: rtl; text-align: right; font-family: var(--f-body); background: var(--raise); border-radius: 10px; }
.note { font-size: 14px; color: var(--muted); background: var(--raise); padding: 10px 12px; border-radius: 10px; }
.note.warn { color: var(--ink); background: var(--warn-soft); }
.src { font-size: 12px; color: var(--muted); }
.tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--raise); border: 1px solid var(--line); }
.tag.down { color: var(--down); background: var(--down-soft); border-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: 14px; transition: border-color .2s, transform .12s; }
.chip:hover { border-color: var(--accent); } .chip:active { transform: scale(.96); }
.loading { display: flex; gap: 10px; align-items: center; color: var(--muted); padding: 14px 0; }
.loading i { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
details { border-top: 1px solid var(--line); padding: 8px 0; } details summary { cursor: pointer; font-weight: 600; } details blockquote { margin-top: 8px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tiles div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; }
.tiles b { font-family: var(--f-display); font-weight: 400; font-size: 28px; font-variant-numeric: tabular-nums; } .tiles span { font-size: 13px; color: var(--muted); }
.pbar { display: grid; grid-template-columns: minmax(0, 1.4fr) 2fr auto; gap: 10px; align-items: center; font-size: 14px; }
.pbar div { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; } .pbar i { display: block; height: 100%; background: var(--up); transition: width .8s var(--ease); }
.pbar b { font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; background: var(--raise); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-size: 14px; color: var(--muted); transition: background .2s, color .2s; min-height: 36px; }
.seg button.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }
.seg button.on.buy { background: var(--up); color: #fff; } .seg button.on.sell { background: var(--down); color: #fff; }
.confirm { background: var(--down-soft); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; margin-top: 8px; }
.verdict { padding: 10px 12px; border-radius: 10px; background: var(--raise); font-weight: 500; }
.verdict.up { background: var(--up-soft); color: var(--ink); } .verdict.down { background: var(--down-soft); color: var(--ink); } .verdict.warn { background: var(--warn-soft); }
.meter { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; } .meter i { display: block; height: 100%; width: 0; transition: width .5s var(--ease); background: var(--up); } .meter i.warn { background: var(--warn); } .meter i.down { background: var(--down); }

/* labs */
.lab { gap: 14px; }
.ctls { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 18px; }
.ctls.row { display: flex; flex-wrap: wrap; align-items: flex-end; }
.ctl { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; font-size: 14px; min-width: 0; }
.ctl > span { color: var(--muted); }
.ctl input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); height: 28px; }
.ctl output { grid-row: 1; grid-column: 2; font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; direction: ltr; }
.ctl-num, .ctl-sel, .ctl-area { grid-template-columns: 1fr; }
.ctl-num { position: relative; }
.ctl-num em { position: absolute; left: 10px; bottom: 9px; font-style: normal; color: var(--muted); font-size: 13px; }
.ctl-num input[type="number"] { font-family: var(--f-mono); direction: ltr; text-align: right; padding-left: 30px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
.kv > div { background: var(--raise); border-radius: 10px; padding: 9px 12px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.kv span { font-size: 13px; color: var(--muted); } .kv b { font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; font-size: 16px; overflow-wrap: anywhere; }
.kv .hi { background: var(--accent-soft); } .kv .up b, .kv b.up { color: var(--up); } .kv .down b, .kv b.down { color: var(--down); }
.kv.tight { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; } .kv.tight > div { padding: 7px 10px; }
.tbl-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--line); }
.tbl { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 7px 10px; text-align: start; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th { background: var(--raise); font-weight: 600; font-size: 13px; color: var(--muted); }
.tbl tr:last-child td { border-bottom: 0; }
.prose .tbl { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: block; overflow-x: auto; }
.heat-t td { background: color-mix(in srgb, var(--accent) calc(var(--k) * 70%), var(--surface)); text-align: center; font-family: var(--f-mono); font-size: 13px; }
.heat-t td.cur { outline: 2.5px solid var(--ink); outline-offset: -2.5px; font-weight: 700; }
.lab-h { font-size: 16px; margin-top: 4px; }
.chart-wrap { position: relative; width: 100%; }
.chart { width: 100%; height: auto; display: block; direction: ltr; overflow: visible; touch-action: pan-y; }
.chart .grid { stroke: var(--line); stroke-width: 1; } .chart .zero { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .ax { fill: var(--muted); font: 11px var(--f-mono); }
.chart .lbl { font-family: var(--f-body); font-size: 12px; fill: var(--ink); }
.chart .band { fill: var(--accent); opacity: .08; }
.chart .bar { fill: var(--s1); opacity: .85; }
.chart .ref { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 4 3; } .chart .ref.acc { stroke: var(--accent); stroke-dasharray: none; stroke-width: 2.5; }
.chart .ref-l, .chart .mark-l { fill: var(--ink); font-weight: 600; }
.chart .mark { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .dot { fill: var(--s1); opacity: .45; }
.chart .xhair { stroke: var(--muted); stroke-width: 1; }
.chart .draw { stroke-dasharray: 1; animation: draw 1s var(--ease); }
.chart .grow { transform-origin: left; animation: grow .6s var(--ease); transform-box: fill-box; }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes grow { from { transform: scaleX(0); } }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.legend i, .tip i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 5px; vertical-align: -1px; }
.tip { position: absolute; top: 24px; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 9px; border-radius: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; z-index: 2; }

/* sheets & modals */
.sheet-bg, .modal-bg { position: fixed; inset: 0; z-index: 70; background: rgba(8, 14, 12, .45); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
.sheet-bg.out { animation: fade .2s reverse forwards; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-width: 640px; max-height: 86vh; background: var(--surface); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; animation: up .3s var(--ease); padding-bottom: env(safe-area-inset-bottom, 0px); }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
.sheet header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.x { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--raise); font-size: 16px; }
.sheet-body { overflow-y: auto; padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 12px; }
.gloss { margin: 0; display: flex; flex-direction: column; gap: 10px; } .gloss dt { font-weight: 700; } .gloss dd { margin: 0; color: var(--muted); }
.chat { display: flex; flex-direction: column; gap: 8px; min-height: 160px; max-height: 50vh; overflow-y: auto; }
.msg { max-width: 88%; padding: 10px 13px; border-radius: 14px; animation: pop .2s var(--ease); line-height: 1.55; }
.msg.me { align-self: flex-start; background: var(--accent); color: var(--accent-ink); border-end-start-radius: 4px; }
.msg.bot { align-self: flex-end; background: var(--raise); border-end-end-radius: 4px; }
.msg .cite { border-top: 1px solid var(--line); padding-top: 6px; margin-top: 6px; font-size: 14px; }
.typing { display: flex; gap: 4px; } .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; } .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: .2; } }
.chat-in { display: flex; gap: 8px; } .chat-in input { flex: 1; }
.modal-bg { align-items: center; padding: 16px; }
.modal { width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; background: var(--surface); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 12px; animation: pop .3s var(--ease); }
.intro-list { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 8px; }
.grade { display: flex; gap: 14px; align-items: center; } .grade b { font-family: var(--f-display); font-weight: 400; font-size: 52px; width: 72px; height: 72px; border-radius: 18px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.grade.g-A b, .grade.g-B b { background: var(--up-soft); color: var(--up); } .grade.g-D b, .grade.g-F b { background: var(--down-soft); color: var(--down); }
.reveal { background: var(--accent-soft); padding: 10px 12px; border-radius: 10px; }

/* toasts */
#toasts { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 64px); left: 50%; transform: translateX(-50%); z-index: 99; display: flex; flex-direction: column; gap: 6px; align-items: center; width: min(92vw, 460px); pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; box-shadow: var(--shadow); animation: toastIn .3s var(--ease); text-align: center; }
.toast-good { background: var(--up); color: #fff; } .toast-warn { background: var(--warn); color: #fff; }
.toast.out { animation: toastIn .3s reverse forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } }
.copy-fallback { position: fixed; opacity: 0; }

/* simulator */
.sim { display: flex; flex-direction: column; gap: 12px; }
.sim-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.sim-setup { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; min-width: 0; }
.sim-setup select, .sim-setup input { width: auto; max-width: 100%; flex: 1 1 150px; min-height: 40px; }
.sim-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; align-items: start; }
.sim-main, .sim-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.quote { display: grid; grid-template-columns: auto auto 1fr; gap: 2px 14px; align-items: baseline; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.q-name { grid-column: 1 / -1; font-size: 13px; color: var(--muted); font-weight: 600; }
.q-px { font-family: var(--f-mono); font-size: 30px; font-weight: 500; font-variant-numeric: tabular-nums; direction: ltr; transition: color .3s; }
.q-ch { font-family: var(--f-mono); font-variant-numeric: tabular-nums; direction: ltr; font-weight: 500; }
.q-ba { grid-column: 1 / -1; display: flex; gap: 14px; flex-wrap: wrap; font: 12px var(--f-mono); color: var(--muted); direction: ltr; justify-content: flex-end; }
.q-date { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--up); animation: blink 1.2s infinite; }
.sim-chart { height: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; direction: ltr; }
.fallback-chart { padding: 20px; color: var(--muted); }
.sim-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.speeds button { min-width: 44px; font-family: var(--f-mono); }
.prog { flex: 1; min-width: 80px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; } .prog i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.trade-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.trade-btns .btn { min-height: 52px; font-size: 18px; }
.ticket { background: var(--surface); border: 1.5px solid var(--accent); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
.ticket.in { animation: pop .25s var(--ease); }
.tk-head { display: flex; justify-content: space-between; align-items: center; }
.tk-est .kv { margin-bottom: 4px; } .tk-est p { font-size: 13px; }
.acct { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.acct-head { display: flex; flex-direction: column; } .acct-head span { font-size: 13px; color: var(--muted); }
.acct-head b { font-family: var(--f-mono); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; direction: ltr; text-align: right; }
.acct-head em { font-style: normal; font-family: var(--f-mono); direction: ltr; text-align: right; }
.eq-host { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; } .eq-host:empty { display: none; }
.sim-tabs { display: flex; flex-direction: column; gap: 10px; }
#sm-tab { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-height: 100px; }
.coach { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.coach li { border-inline-start: 3px solid var(--muted); padding: 4px 12px; display: flex; flex-direction: column; gap: 2px; animation: pop .25s var(--ease); }
.coach .c-warn { border-color: var(--warn); } .coach .c-good { border-color: var(--up); } .coach .c-info { border-color: var(--s1); }
.coach time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.coach .link { align-self: flex-start; font-size: 14px; }
.orders { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; } .orders li { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.ping { animation: pingA .6s 2; } @keyframes pingA { 50% { background: var(--warn-soft); } }

@media (max-width: 900px) {
  .sim-grid { grid-template-columns: 1fr; }
  .sim-chart { height: 300px; }
  .ticket { position: fixed; left: 0; right: 0; bottom: 0; z-index: 65; border-radius: 20px 20px 0 0; border-width: 1px 0 0; max-height: 82vh; overflow-y: auto; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  .ticket.in { animation: up .3s var(--ease); }
}
@media (max-width: 560px) {
  body { font-size: 15.5px; }
  .hero { grid-template-columns: 1fr; } .ring { position: absolute; top: 72px; left: 16px; width: 76px; height: 76px; } .ring b { font-size: 22px; } .ring span { font-size: 10px; }
  .hero-txt { padding-left: 84px; }
  .quick { grid-template-columns: 1fr; }
  .facts { grid-template-columns: 1fr 1fr; } .facts b { font-size: 24px; }
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .brand span { display: none; }
  .pbar { grid-template-columns: 1fr auto; } .pbar div { grid-column: 1 / -1; grid-row: 2; }
  .fab span { display: none; } .fab { padding: 12px; }
  .q-px { font-size: 26px; }
  .sim-top { flex-direction: column; align-items: stretch; }
  .sim-top > .seg { align-self: flex-start; }
  .sim-setup select, .sim-setup input { flex: 1 1 45%; }
  .sim-bar .prog { order: 5; flex-basis: 100%; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
